kind = "mobile"
previewPath = "/"
title = "MotoRide Kigali"
version = "1.0.0"
id = "artifacts/moto-kigali"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22247

[services.development]
run = "pnpm --filter @workspace/moto-kigali run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moto-kigali", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/moto-kigali", "run", "serve" ]

[services.env]
PORT = "22247"
BASE_PATH = "/"
